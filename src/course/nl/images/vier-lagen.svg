<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" role="img" aria-labelledby="tl ds">
<title id="tl">De vier lagen van een deconstructie</title>
<desc id="ds">Vier lagen boven elkaar. Onderaan laag 1, het einddoel. Daarboven laag 2, de richtingen. Daarboven laag 3, wat je moet weten of kunnen. Bovenaan laag 4, de concrete stappen, die doorlopen naar je scrum-taken. Je bouwt van onder naar boven.</desc>
<style>
  .t{font-family:Arial,Helvetica,sans-serif}
  .lab{font-size:12px;font-weight:bold;letter-spacing:.09em;fill:#E5007D}
  .q{font-size:19px;font-weight:bold;fill:#1C1C1E}
  .out{font-size:14.5px;fill:#46464B}
  .rail{font-size:12.5px;font-weight:bold;letter-spacing:.16em;fill:#B00061}
  .scrum{font-size:15px;font-weight:bold;fill:#B00061}
  .num{font-size:13px;font-weight:bold;fill:#fff}
</style>
<rect width="900" height="636" fill="#FFFFFF"/>

<!-- linkerrail: richting -->
<g class="t">
  <line x1="34" y1="596" x2="34" y2="112" stroke="#F5B8D8" stroke-width="3"/>
  <polygon points="34,96 27,116 41,116" fill="#E5007D"/>
  <text class="rail" transform="translate(22,430) rotate(-90)">BOUW VAN ONDER NAAR BOVEN</text>
</g>

<!-- scrum-uitkomst bovenaan -->
<g class="t">
  <rect x="70" y="20" width="810" height="52" rx="10" fill="#FDEBF4" stroke="#E5007D" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="scrum" x="475" y="43" text-anchor="middle">Volgende stap: zet de concrete stappen om in scrum-taken</text>
  <text class="out" x="475" y="62" text-anchor="middle">product backlog en sprintplanning</text>
</g>
<polygon points="475,80 468,94 482,94" fill="#9A9AA2"/>

<!-- LAAG 4 -->
<g class="t">
  <rect x="70" y="100" width="810" height="112" rx="10" fill="#FFFFFF" stroke="#E4E4E8" stroke-width="1.5"/>
  <rect x="70" y="100" width="7" height="112" rx="3.5" fill="#E5007D"/>
  <circle cx="104" cy="130" r="13" fill="#E5007D"/><text class="num" x="104" y="135" text-anchor="middle">4</text>
  <text class="lab" x="128" y="135">LAAG 4 · CONCRETE STAPPEN — BOVENAAN</text>
  <text class="q" x="104" y="166">Wat ga ik nu concreet doen?</text>
  <text class="out" x="104" y="192">Je acties voor nu, klaar om in te plannen.</text>
</g>
<polygon points="475,222 468,236 482,236" fill="#9A9AA2"/>

<!-- LAAG 3 -->
<g class="t">
  <rect x="70" y="242" width="810" height="112" rx="10" fill="#FFFFFF" stroke="#E4E4E8" stroke-width="1.5"/>
  <rect x="70" y="242" width="7" height="112" rx="3.5" fill="#E5007D"/>
  <circle cx="104" cy="272" r="13" fill="#E5007D"/><text class="num" x="104" y="277" text-anchor="middle">3</text>
  <text class="lab" x="128" y="277">LAAG 3 · WETEN OF KUNNEN</text>
  <text class="q" x="104" y="308">Wat moet ik daarvoor weten of kunnen?</text>
  <text class="out" x="104" y="334">Wat je al weet — en wat nog een leerstap is.</text>
</g>
<polygon points="475,364 468,378 482,378" fill="#9A9AA2"/>

<!-- LAAG 2 -->
<g class="t">
  <rect x="70" y="384" width="810" height="112" rx="10" fill="#FFFFFF" stroke="#E4E4E8" stroke-width="1.5"/>
  <rect x="70" y="384" width="7" height="112" rx="3.5" fill="#E5007D"/>
  <circle cx="104" cy="414" r="13" fill="#E5007D"/><text class="num" x="104" y="419" text-anchor="middle">2</text>
  <text class="lab" x="128" y="419">LAAG 2 · RICHTINGEN</text>
  <text class="q" x="104" y="450">Wat heb ik daarvoor nodig?</text>
  <text class="out" x="104" y="476">De grote bouwstenen van je project.</text>
</g>
<polygon points="475,506 468,520 482,520" fill="#9A9AA2"/>

<!-- LAAG 1 -->
<g class="t">
  <rect x="70" y="526" width="810" height="90" rx="10" fill="#E5007D"/>
  <circle cx="104" cy="556" r="13" fill="#FFFFFF"/><text class="num" x="104" y="561" text-anchor="middle" fill="#E5007D">1</text>
  <text class="lab" x="128" y="561" fill="#FDEBF4">LAAG 1 · EINDDOEL — ONDERAAN, HIER BEGIN JE</text>
  <text class="q" x="104" y="592" fill="#FFFFFF">Wat wil ik uiteindelijk opleveren? Schets het.</text>
</g>
</svg>
