<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" role="img" aria-labelledby="t7 d7">
<title id="t7">Werkkaart tegenover kunstwerk</title>
<desc id="d7">Twee deconstructies naast elkaar. Links een kunstwerk: zeven lagen met veel kleine grijze blokjes, netjes en symmetrisch, maar bovenaan staat geen enkele uitvoerbare taak. Rechts een werkkaart: vier lagen, met twee gemarkeerde leerstappen, en bovenaan drie taken die je deze week kunt oppakken.</desc>
<style>
  .t{font-family:Arial,Helvetica,sans-serif}
  .h{font-size:16px;font-weight:bold;fill:#1C1C1E}
  .s{font-size:13px;fill:#46464B}
  .oor{font-size:12.5px;font-weight:bold;fill:#C0392B}
  .goe{font-size:12.5px;font-weight:bold;fill:#1E8A5A}
  .mini{font-size:10.5px;fill:#8A8A8E}
  .taak{font-size:11.5px;fill:#1C1C1E}
</style>
<rect width="900" height="436" fill="#FFFFFF"/>
<line x1="450" y1="30" x2="450" y2="406" stroke="#E4E4E8" stroke-width="1.5"/>

<g class="t">
  <text class="h" x="30" y="42">Kunstwerk</text>
  <text class="s" x="30" y="63">Zeven lagen, symmetrisch, uren werk.</text>
  <g fill="#F4F4F6" stroke="#C9C9D0" stroke-width="1">
    <rect x="40" y="86" width="76" height="22" rx="4"/><rect x="128" y="86" width="76" height="22" rx="4"/>
    <rect x="216" y="86" width="76" height="22" rx="4"/><rect x="304" y="86" width="76" height="22" rx="4"/>
    <rect x="62" y="122" width="76" height="22" rx="4"/><rect x="150" y="122" width="76" height="22" rx="4"/>
    <rect x="238" y="122" width="76" height="22" rx="4"/><rect x="326" y="122" width="54" height="22" rx="4"/>
    <rect x="40" y="158" width="76" height="22" rx="4"/><rect x="128" y="158" width="76" height="22" rx="4"/>
    <rect x="216" y="158" width="76" height="22" rx="4"/><rect x="304" y="158" width="76" height="22" rx="4"/>
    <rect x="62" y="194" width="76" height="22" rx="4"/><rect x="150" y="194" width="76" height="22" rx="4"/>
    <rect x="238" y="194" width="76" height="22" rx="4"/><rect x="326" y="194" width="54" height="22" rx="4"/>
    <rect x="40" y="230" width="76" height="22" rx="4"/><rect x="128" y="230" width="76" height="22" rx="4"/>
    <rect x="216" y="230" width="76" height="22" rx="4"/><rect x="304" y="230" width="76" height="22" rx="4"/>
    <rect x="90" y="266" width="112" height="22" rx="4"/><rect x="214" y="266" width="112" height="22" rx="4"/>
  </g>
  <rect x="90" y="302" width="236" height="26" rx="5" fill="#F4F4F6" stroke="#C9C9D0"/>
  <text class="mini" x="208" y="318" text-anchor="middle">einddoel</text>
  <rect x="30" y="348" width="390" height="52" rx="8" fill="#FBEAE8" stroke="#C0392B" stroke-width="1.5"/>
  <text class="oor" x="50" y="371">Bovenaan staat geen enkele taak</text>
  <text class="s" x="50" y="390" fill="#C0392B">die je maandag kunt oppakken.</text>
</g>

<g class="t">
  <text class="h" x="484" y="42">Werkkaart</text>
  <text class="s" x="484" y="63">Vier lagen, klaar in een uur, meteen bruikbaar.</text>

  <rect x="484" y="86" width="118" height="34" rx="5" fill="#FFFFFF" stroke="#E5007D" stroke-width="1.5"/>
  <text class="taak" x="496" y="100">Criteria kiezen</text><text class="taak" x="496" y="114">+ data checken</text>
  <rect x="614" y="86" width="118" height="34" rx="5" fill="#FFFFFF" stroke="#E5007D" stroke-width="1.5"/>
  <text class="taak" x="626" y="100">3 voorbeelden</text><text class="taak" x="626" y="114">zoeken</text>
  <rect x="744" y="86" width="118" height="34" rx="5" fill="#FFFFFF" stroke="#E5007D" stroke-width="1.5"/>
  <text class="taak" x="756" y="100">Tool kiezen +</text><text class="taak" x="756" y="114">briefing (14)</text>

  <rect x="484" y="146" width="118" height="30" rx="5" fill="#FFFFFF" stroke="#E4E4E8" stroke-width="1.5"/>
  <text class="mini" x="543" y="165" text-anchor="middle">deels bekend</text>
  <rect x="614" y="146" width="118" height="30" rx="5" fill="#FDEBF4" stroke="#E5007D" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="mini" x="673" y="165" text-anchor="middle" fill="#B00061">leerstap</text>
  <rect x="744" y="146" width="118" height="30" rx="5" fill="#FDEBF4" stroke="#E5007D" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="mini" x="803" y="165" text-anchor="middle" fill="#B00061">leerstap</text>

  <rect x="484" y="202" width="118" height="30" rx="5" fill="#FFFFFF" stroke="#E5007D" stroke-width="1.5"/>
  <text class="mini" x="543" y="221" text-anchor="middle">inhoud</text>
  <rect x="614" y="202" width="118" height="30" rx="5" fill="#FFFFFF" stroke="#E5007D" stroke-width="1.5"/>
  <text class="mini" x="673" y="221" text-anchor="middle">ontwerp</text>
  <rect x="744" y="202" width="118" height="30" rx="5" fill="#FFFFFF" stroke="#E5007D" stroke-width="1.5"/>
  <text class="mini" x="803" y="221" text-anchor="middle">bouwen</text>

  <rect x="484" y="258" width="378" height="34" rx="5" fill="#E5007D"/>
  <text class="taak" x="673" y="280" text-anchor="middle" fill="#FFFFFF">einddoel: vergelijkingspagina</text>

  <rect x="484" y="348" width="386" height="52" rx="8" fill="#E7F4EE" stroke="#1E8A5A" stroke-width="1.5"/>
  <text class="goe" x="504" y="371">Drie taken voor deze week,</text>
  <text class="s" x="504" y="390" fill="#1E8A5A">en twee leerstappen die je meteen ziet staan.</text>
</g>
</svg>
